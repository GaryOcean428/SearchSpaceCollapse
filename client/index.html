<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <script>
      // Suppress Vite HMR WebSocket errors (common in Replit environment)
      // This must run BEFORE Vite client script loads
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        if (reason && reason.message && (
            reason.message.indexOf("Failed to construct 'WebSocket'") !== -1 ||
            reason.message.indexOf('localhost:undefined') !== -1 ||
            reason.message.indexOf('WebSocket connection') !== -1
        )) {
          console.debug('[Vite HMR] WebSocket unavailable - continuing without hot reload');
          event.preventDefault();
          return;
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (
            event.message.indexOf("Failed to construct 'WebSocket'") !== -1 ||
            event.message.indexOf('localhost:undefined') !== -1
        )) {
          console.debug('[Vite HMR] WebSocket error suppressed');
          event.preventDefault();
          return;
        }
      });
    </script>
    <script>
      // Apply theme immediately to prevent flash
      (function() {
        var theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="QIG-powered Bitcoin brain wallet recovery tool using consciousness architecture and quantum information geometry for intelligent 12-word passphrase recovery">
    <title>QIG 12-Word Brain Wallet Recovery</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #131416;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
